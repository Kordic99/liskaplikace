name: Publish Liškaplikace PROD + TEST
on:
  push:
    branches: [main, test]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name == 'main' && github.sha || 'main' }}
          path: production
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name == 'test' && github.sha || 'test' }}
          path: testing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            testing/package-lock.json
      - name: Validate PROD release history
        working-directory: production
        run: |
          PRODUCTION_SHA=$(git rev-parse HEAD) node tools/check-releases.mjs --require-new
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check and build PROD
        working-directory: production
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:cloud
          npm run test:catalog
          npm run test:releases
          npm run test:covers --if-present
          BUILD_COMMIT=$(git rev-parse HEAD) npm run build:pages
        env:
          APP_ENV: production
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_BOOKS_API_KEY: ${{ vars.VITE_GOOGLE_BOOKS_API_KEY }}
          PAGES_BASE_PATH: /liskaplikace/
      - name: Check and build TEST
        working-directory: testing
        run: |
          npm ci --no-audit --no-fund
          node tools/check-releases.mjs
          npm run typecheck
          npm run test:cloud
          npm run test:catalog
          npm run test:releases
          npm run test:covers
          npm run test:own-catalog
          BUILD_COMMIT=$(git rev-parse HEAD) npm run build:pages
        env:
          APP_ENV: test
          PAGES_BASE_PATH: /liskaplikace/test/
      - name: Assemble isolated applications
        run: node production/tools/assemble-pages.mjs production/dist-pages testing/dist-pages-test dist-paired
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-paired
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
